[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
; VS Code PlatformIO target: classic ESP32 Dev Module / ESP32-WROOM class.
; Pin the platform because this project is validated against Arduino-ESP32 2.0.5.
platform = espressif32@5.2.0
board = esp32dev
framework = arduino

; Explicit generic ESP32 DevKit/WROOM-32U constraints.
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.partitions = partitions/huge_app.csv
upload_protocol = esptool

; Local 4MB huge-app partition: 3MB APP + 960KB SPIFFS, no second OTA slot.
; Do not hard-code COM ports. Select/upload from the PlatformIO VS Code toolbar.
monitor_speed = 9600
upload_speed = 460800

; Keep dependency discovery deterministic in PlatformIO IDE/IntelliSense.
lib_ldf_mode = chain+
lib_compat_mode = strict

; Pin exact upstream revisions using VCS URLs.
; This deliberately avoids PlatformIO Registry package IDs because the user's
; VS Code PlatformIO installation failed to resolve the old Registry form.
lib_deps =
    https://github.com/adafruit/Adafruit_BusIO.git#0348f74375d7ddd5b3716a66624845d838582676
    https://github.com/adafruit/Adafruit-GFX-Library.git#5ea4be3ffeae918899aeec8cbb67f87359cf0026
    https://github.com/adafruit/Adafruit_ILI9341.git#be74aa6d3a787592ee869d0fb9fd46d01adb7b50
    https://github.com/adafruit/Adafruit_NeoPixel.git#9a9104c6ede08097f8067f4005837ff56a3d2936
    https://github.com/koogar/ErriezRotaryEncoderFullStep.git#0532741024f95bd3ba3804d2c525f470e3c3e788

; Runs inside PlatformIO/SCons before compilation and freezes the legacy serial parser.
extra_scripts =
    pre:tools/pio_protocol_guard.py

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D PHAT_PLATFORMIO_BUILD=1
